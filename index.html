<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#120d1f" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>QHAZE TECH UNIVERSITY</title>
    <script>
      // Apply cached theme before first paint to avoid a light/dark flash.
      // The authoritative value lives in IndexedDB (settings table).
      try {
        var t = localStorage.getItem('qhaze.theme') || 'dark';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) { document.documentElement.classList.add('dark'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
